"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts (default: true)
add_newline = false

format = """
$time\
$directory\
$git_branch\
$git_state\
$git_status\
$status\
$cmd_duration\
[](fg:prev_bg)\
$fill\
$line_break\
$character"""

palette = 'tomsquest'

[palettes.tomsquest]
color_time = '#C9C3E6'
color_dir = '#E4D6F9'
color_git = '#FFC5E4'
color_text = '#444444'
color_status = '#FF7AC1'
color_duration = '#C6DEF1'

[time]
disabled = false
format = '[ $time ]($style)'
style = "bold fg:color_text bg:color_time"

[directory]
format = "[](fg:prev_bg bg:color_dir)[ $path ]($style)"
style = "bold fg:color_text bg:color_dir"
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[fill]
symbol = '─'
style = 'white'

[git_branch]
format = '[](fg:prev_bg bg:color_git)[ $branch ]($style)'
style = "bold fg:color_text bg:color_git"

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = "bold fg:color_text bg:color_git"
# Do not show stashed
stashed = ""
# Add the count
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[git_state]
style = "black"

[status]
disabled = false
format = '[](fg:prev_bg bg:color_status)[ $symbol $common_meaning$signal_name$maybe_int ]($style)'
style = 'bold fg:black bg:color_status'
symbol = '✘'
pipestatus = true
pipestatus_separator = ' │ '
pipestatus_segment_format = '$status'
pipestatus_format = '[](fg:prev_bg bg:color_status)[ $symbol $pipestatus → $status ]($style)'

[cmd_duration]
format = '[](fg:prev_bg bg:color_duration)[ took $duration ]($style)'
style = "bold fg:color_text bg:color_duration"
min_time = 10_000