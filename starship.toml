"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts (default: true)
add_newline = false

format = """
$time\
[](fg:color_1 bg:color_2)\
$directory\
[](fg:color_2 bg:color_3)\
$git_branch\
$git_state\
$git_status\
$status\
$cmd_duration\
$fill\
$line_break\
$character"""

palette = 'tomsquest'

[palettes.tomsquest]
color_1 = '#C9C3E6'
color_2 = '#E4D6F9'
color_3 = '#FFC5E4'
color_text = '#444444'
color_error = '#FF9D93'

[time]
disabled = false # the module is disabled by default
format = '[ $time ]($style)'
style = "bold fg:color_text bg:color_1"

[directory]
format = "[ $path ]($style)"
style = "bold fg:color_text bg:color_2"
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[fill]
symbol = '─'
style = 'white'

[git_branch]
format = '[ $branch ]($style)'
style = "bold fg:color_text bg:color_3"

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = "bold fg:color_text bg:color_3"
# Do not show stashed
stashed = ""
# Add the count
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[git_state]
style = "black"

[status]
# Also closes the git segment: an arrow on success, a red segment on error
disabled = false # the module is disabled by default
format = '$symbol'
success_symbol = '[](fg:color_3)'
symbol = '[](fg:color_3 bg:color_error)[ ✘ ($pipestatus → )$status ](bold fg:black bg:color_error)[](fg:color_error)'
pipestatus = true
pipestatus_separator = ' │ '
pipestatus_segment_format = '$status'
pipestatus_format = '$symbol'

[cmd_duration]
format = '[ took $duration ]($style)'
style = "bright white"
min_time = 30_000
